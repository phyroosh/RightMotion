<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Amber Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf8e1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Orbital Ring Gradient -->
    <linearGradient id="orbitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8e1"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cream Core Gradient -->
    <linearGradient id="prismGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdf8e1"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>

    <!-- Slice Gradient -->
    <linearGradient id="sliceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf8e1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="cosmicBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Dark Universe Nebula Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#nebulaGlow)"/>

  <!-- Outer Orbital Shutter Frame -->
  <circle cx="256" cy="256" r="208" stroke="url(#orbitalGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="192" stroke="url(#orbitalGrad)" stroke-width="2" opacity="0.5"/>

  <!-- 4 Corner Precision Telemetry Crosshairs -->
  <path d="M256 36 L256 56 M256 456 L256 476 M36 256 L56 256 M456 256 L476 256" stroke="#fdf8e1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Iconic Stylized RightClips Brandmark (The "R" + Playback Prism + Precision Clip) -->
  <g filter="url(#cosmicBloom)">
    <!-- Vertical Anchor Spine -->
    <rect x="136" y="128" width="48" height="256" rx="14" fill="url(#prismGrad)"/>

    <!-- Upper Curvature Loop (Aperture Chamber) -->
    <path d="M172 128 H284 C342 128 384 164 384 218 C384 270 342 306 284 306 H172 V128 Z" fill="url(#prismGrad)" opacity="0.95"/>
    <!-- Inner Lens Void -->
    <path d="M184 172 H276 C308 172 332 192 332 218 C332 244 308 264 276 264 H184 V172 Z" fill="#050505"/>

    <!-- Energetic Forward Clip Prism (The "Right" Angle & Dynamic Leg) -->
    <path d="M254 286 L360 404 C368 413 382 413 390 404 C398 395 398 381 390 372 L294 266 L254 286 Z" fill="url(#sliceGrad)"/>
    
    <!-- Precision Fast-Forward Shutter Blade -->
    <polygon points="212,192 258,218 212,244" fill="#f59e0b"/>
    <polygon points="266,192 312,218 266,244" fill="#fdf8e1"/>

    <!-- High-Impact Apex Star Spark -->
    <circle cx="384" cy="218" r="8" fill="#ffffff"/>
  </g>
</svg>
