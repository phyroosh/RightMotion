<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Orbital Ring Gradient -->
    <linearGradient id="orbitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0071e3"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Core Dynamic Prism "R" Gradient -->
    <linearGradient id="prismGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Forward Shutter Slice Gradient -->
    <linearGradient id="sliceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Cosmic Core Glow Filter -->
    <filter id="cosmicBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
    </filter>
  </defs>

  <!-- Ambient Dark Universe Nebula Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#nebulaGlow)"/>
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Outer Orbital Shutter Frame -->
  <circle cx="256" cy="256" r="208" stroke="url(#orbitalGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="192" stroke="url(#orbitalGrad)" stroke-width="3" opacity="0.75"/>

  <!-- 4 Corner Precision Telemetry Crosshairs -->
  <path d="M256 36 L256 56 M256 456 L256 476 M36 256 L56 256 M456 256 L476 256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="256" r="192" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 36" opacity="0.5"/>

  <!-- Iconic Stylized RightClips Brandmark (The "R" + Playback Prism + Precision Clip) -->
  <g filter="url(#cosmicBloom)">
    <!-- Vertical Anchor Spine -->
    <rect x="136" y="128" width="48" height="256" rx="14" fill="url(#prismGrad)"/>

    <!-- Upper Curvature Loop (Aperture Chamber) -->
    <path d="M172 128 H284 C342 128 384 164 384 218 C384 270 342 306 284 306 H172 V128 Z" fill="url(#prismGrad)" opacity="0.95"/>
    <!-- Inner Lens Void -->
    <path d="M184 172 H276 C308 172 332 192 332 218 C332 244 308 264 276 264 H184 V172 Z" fill="#030712"/>

    <!-- Energetic Forward Clip Prism (The "Right" Angle & Dynamic Leg) -->
    <path d="M254 286 L360 404 C368 413 382 413 390 404 C398 395 398 381 390 372 L294 266 L254 286 Z" fill="url(#sliceGrad)"/>
    
    <!-- Precision Fast-Forward Shutter Blade -->
    <polygon points="212,192 258,218 212,244" fill="#38bdf8"/>
    <polygon points="266,192 312,218 266,244" fill="#ffffff"/>

    <!-- High-Impact Cosmic Apex Star Spark -->
    <circle cx="384" cy="218" r="8" fill="#ffffff"/>
    <circle cx="384" cy="218" r="16" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>
